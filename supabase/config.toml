project_id = "fate-cargo-360"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Phone-number + OTP is the ONLY customer sign-in method in FATE CARGO 360.
[auth.sms]
enable_signup = true
enable_confirmations = false
# Configure a real provider (Twilio / MessageBird / Vonage) in the
# Supabase Dashboard -> Authentication -> Providers -> Phone for
# production. Local `supabase start` uses the test OTP defined below.
# template = "Your FATE CARGO 360 verification code is {{ .Code }}"

[auth.email]
enable_signup = false
enable_confirmations = false
# IMPORTANT: enable_signup stays false - this blocks public self-registration
# via email/password. Staff/admin/warehouse/driver accounts are created
# ONLY server-side by an existing admin (via the Supabase Admin API using
# the service-role key, in src/actions/team.ts), which bypasses this flag
# by design. Verify this same "Enable email signup: OFF" setting in
# Supabase Dashboard -> Authentication -> Providers -> Email for your
# hosted project - this file only affects local `supabase start`.
# Password reset emails use Supabase's built-in email sending for auth
# emails, which works without any SMS/Twilio setup.

[storage]
enabled = true
file_size_limit = "10MiB"
